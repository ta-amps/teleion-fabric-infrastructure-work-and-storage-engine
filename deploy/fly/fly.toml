# Tessera service on one Fly.io machine with a volume (brief L20). Deploys need Taylor's approval.
#   fly deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
app = "tessera-fabric"          # change if the name is taken
primary_region = "iad"

[env]
  TESSERA_DB = "/data/tessera.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # a queue with leases must keep its reaper running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[mounts]]
  source = "tessera_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
