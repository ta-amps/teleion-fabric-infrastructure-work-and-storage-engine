name: deploy

# Runs only when started by hand, and every job waits for Taylor's approval in the `production`
# environment (add Taylor as a required reviewer under Settings > Environments). Store FLY_API_TOKEN,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of that environment.

on:
  workflow_dispatch:
    inputs:
      part:
        description: What to deploy
        type: choice
        options: [both, service, edge]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  service:
    name: Service to Fly.io
    if: ${{ inputs.part == 'both' || inputs.part == 'service' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Send only the sources to the builder
        run: cp deploy/fly/Dockerfile.dockerignore .dockerignore
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy .
          --config deploy/fly/fly.toml
          --dockerfile deploy/fly/Dockerfile
          --remote-only

  edge:
    name: Edge to Cloudflare
    if: ${{ inputs.part == 'both' || inputs.part == 'edge' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config deploy/cloudflare/wrangler.jsonc
